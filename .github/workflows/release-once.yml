name: Release v1.0.0 (once)
on:
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        working-directory: sign-app
        run: gradle assembleDebug --no-daemon

      - name: Publish Release v1.0.0
        run: |
          cd sign-app/app/build/outputs/apk/debug
          gh release create v1.0.0 *.apk \
            --title "定时云签 v1.0.0" \
            --notes "TRAE / WorkBuddy 多账号自动签到助手

## 功能
- TRAE / WorkBuddy 多账号登录与管理，凭证自动同步云端
- 定时自动签到（北京时间可配置，支持单独设置各平台时间）
- 一键立即签到（等待云端完成）
- 签到日志：积分/额度变化、手动/自动统计、近 7 天趋势
- 登录态失效提醒、云端凭证加密（可选 AES-256-GCM）、深色模式

## 注意
Debug 版本。首次使用需 GitHub 授权（Token 勾选 repo + workflow）。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
