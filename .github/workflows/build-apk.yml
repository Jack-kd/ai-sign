name: Build SignApp APK

on:
  push:
    paths:
      - 'sign-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        working-directory: sign-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sign-app-debug
          path: sign-app/app/build/outputs/apk/debug/*.apk
      # [一次性] 上传 APK 到 v1.0.0（发布后移除本步骤）
      - name: Upload APK to v1.0.0 (one-off)
        run: |
          cd sign-app/app/build/outputs/apk/debug
          gh release create v1.0.0 *.apk --title "定时云签 v1.0.0" --notes "TRAE / WorkBuddy 多账号自动签到助手" || gh release upload v1.0.0 *.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
